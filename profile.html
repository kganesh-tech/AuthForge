<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | AuthForge</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>

<div class="profile-card">

    <div class="profile-header">

        <div class="avatar" id="avatar">
            GK
        </div>

        <h2 id="fullName">Ganesh</h2>

        <p id="username">@ganesh</p>

    </div>

    <div class="profile-body">

        <div class="info">
            <span>Full Name</span>
            <p id="fullNameInfo">Ganesh</p>
        </div>

        <div class="info">
            <span>Username</span>
            <p id="usernameInfo">@ganesh</p>
        </div>

        <div class="info">
            <span>Email</span>
            <p id="email">ganesh@gmail.com</p>
        </div>

        

    </div>

    <button class="edit-btn">
        Edit Profile
    </button>

</div>

<script src="profile.js"></script>

</body>
</html>
